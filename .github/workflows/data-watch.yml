name: Public data candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'
permissions:
  contents: read
jobs:
  public-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 beautifulsoup4==4.15.0
      - name: Refresh public descriptions and score facts
        run: |
          python scripts/update_model_reference.py
          python scripts/update_benchmark_snapshots.py
          python scripts/watch_public_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: api-mri-data-candidates
          path: build/data-candidates
          retention-days: 30
          if-no-files-found: error
