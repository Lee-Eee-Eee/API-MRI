name: Windows portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release after all tests and packaged checks pass'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CPython runtime
        shell: pwsh
        run: |
          $runtime = Get-Content scripts/python-runtime.json -Raw | ConvertFrom-Json
          $runtimeDir = Join-Path $env:RUNNER_TEMP "api-mri-python-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $runtimeDir) { throw 'Runtime directory already exists' }
          New-Item -ItemType Directory -Path $runtimeDir | Out-Null
          $archive = Join-Path $runtimeDir 'python-runtime.tar.gz'
          Invoke-WebRequest -Uri $runtime.archive.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $runtime.archive.size_bytes) { throw 'Python runtime archive size mismatch' }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.archive.sha256) { throw 'Python runtime archive SHA-256 mismatch' }
          tar -xzf $archive -C $runtimeDir
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime extraction failed' }
          $runtimePython = Join-Path $runtimeDir $runtime.executable
          & $runtimePython -c "import platform,struct; assert platform.python_version() == '3.12.16'; assert struct.calcsize('P') == 8; print(platform.python_version(), platform.machine())"
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime version or architecture mismatch' }
          & $runtimePython -m venv .build-venv
          if ($LASTEXITCODE -ne 0) { throw 'Build environment creation failed' }
          (Join-Path $env:GITHUB_WORKSPACE '.build-venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'PYTHONUTF8=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PYTHONNOUSERSITE=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache@v4
        with:
          path: '~\AppData\Local\pip\Cache'
          key: ${{ runner.os }}-pip-cpython-3.12.16-${{ hashFiles('requirements-lock.txt', 'scripts/requirements-build.txt', 'scripts/python-runtime.json') }}
      - name: Install pinned CPU dependencies and project
        shell: pwsh
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.16'"
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e '.[api,ui,dev]'
          python -m pip install -r scripts/requirements-build.txt
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None and '+cpu' in torch.__version__"
      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DSH plugin bundle
        shell: pwsh
        run: |
          npm run build:dsh
          if ($LASTEXITCODE -ne 0) { throw 'DSH client build failed' }
          git diff --exit-code -- dsh-plugin/lib
          if ($LASTEXITCODE -ne 0) { throw 'Committed DSH bundle differs from its source' }
          npm run test:dsh
          if ($LASTEXITCODE -ne 0) { throw 'DSH plugin unit tests failed' }
          python -c "import json,tomllib; p=tomllib.load(open('pyproject.toml','rb')); n=json.load(open('package.json')); assert p['project']['version']==n['version']"
      - name: Tests
        run: python -X utf8 -m pytest tests -q
      - name: Build portable bundle
        run: python -X utf8 scripts/build_portable.py --out build/portable-release
      - name: Test packaged executables without Python on PATH
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build/portable-release/dist -Directory | Select-Object -First 1
          python -X utf8 scripts/check_portable.py --bundle "$($bundle.FullName)" --out "build/便携验收 packaged checks"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable acceptance failed' }
      - name: Pack DSH plugin and install index
        shell: pwsh
        run: |
          npm pack --ignore-scripts --pack-destination build/portable-release
          if ($LASTEXITCODE -ne 0) { throw 'DSH tarball build failed' }
          $publishedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          node dsh-plugin/market-index.mjs --commit "$env:GITHUB_SHA" --published-at "$publishedAt" --out build/portable-release/api-mri-dsh-index.json
          if ($LASTEXITCODE -ne 0) { throw 'DSH index build failed' }
          $extraAssets = @(Get-ChildItem build/portable-release/*.tgz) + @(Get-Item build/portable-release/api-mri-dsh-index.json)
          foreach ($asset in $extraAssets) {
            $checksum = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$checksum  $($asset.Name)" | Add-Content -LiteralPath build/portable-release/SHA256SUMS.txt -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API-MRI-portable-validation
          path: build/便携验收 packaged checks/portable-check.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: API-MRI-windows-x64
          path: |
            build/portable-release/*.zip
            build/portable-release/*.tgz
            build/portable-release/api-mri-dsh-index.json
            build/portable-release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = "v$version"
          }
          $notes = "docs/release-$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Authored release notes are required' }
          $existingJson = gh release view "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw 'A published release already exists; its assets will not be replaced' }
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) { throw 'The existing draft targets a different commit; inspect it before retrying' }
            $uploadNames = @((Get-ChildItem build/portable-release/*.zip).Name) + @((Get-ChildItem build/portable-release/*.tgz).Name) + @('api-mri-dsh-index.json', 'SHA256SUMS.txt')
            foreach ($asset in $existing.assets) {
              if ($asset.name -in $uploadNames) { throw "Draft already contains $($asset.name); existing assets will not be replaced" }
            }
          } else {
            gh release create "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "API-MRI $releaseTag" --notes-file $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          gh release upload "$releaseTag" build/portable-release/*.zip build/portable-release/*.tgz build/portable-release/api-mri-dsh-index.json build/portable-release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Assets uploaded, but publishing the draft failed' }
