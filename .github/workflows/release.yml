name: Windows portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            scripts/requirements-build.txt
      - name: Install pinned CPU dependencies and project
        shell: pwsh
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e '.[api,ui,dev]'
          python -m pip install -r scripts/requirements-build.txt
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None and '+cpu' in torch.__version__"
      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
          }
      - name: Tests
        run: python -X utf8 -m pytest tests -q
      - name: Build portable bundle
        run: python -X utf8 scripts/build_portable.py --out build/portable-release
      - name: CLI smoke test
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build/portable-release/dist -Directory | Select-Object -First 1
          & "$($bundle.FullName)/api-mri-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed' }
          & "$($bundle.FullName)/api-mri-cli.exe" service-demo --out build/portable-service-demo
          if ($LASTEXITCODE -ne 0) { throw 'Packaged service demo failed' }
          & "$($bundle.FullName)/api-mri-cli.exe" identify-demo --out build/portable-identify-demo
          if ($LASTEXITCODE -ne 0) { throw 'Packaged identification demo failed' }
          & "$($bundle.FullName)/api-mri-cli.exe" demo --out build/portable-met-demo --permutations 19
          if ($LASTEXITCODE -ne 0) { throw 'Packaged MET demo failed' }
      - name: Portable launcher smoke test
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build/portable-release/dist -Directory | Select-Object -First 1
          $dataDir = Join-Path $env:RUNNER_TEMP 'API-MRI 中文 smoke/data'
          $process = Start-Process -FilePath "$($bundle.FullName)/API-MRI.exe" -ArgumentList @('--smoke-test', '--data-dir', "`"$dataDir`"", '--port', '0') -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Portable launcher failed' }
          $result = Get-Content (Join-Path $dataDir 'smoke-test.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.real_model_calls -ne 0) { throw 'Portable readiness smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: API-MRI-windows-x64
          path: |
            build/portable-release/*.zip
            build/portable-release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
            $notes = "docs/release-$version.md"
            if (-not (Test-Path -LiteralPath $notes)) { throw 'Authored release notes are required' }
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "API-MRI $env:GITHUB_REF_NAME" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload "$env:GITHUB_REF_NAME" build/portable-release/*.zip build/portable-release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
