<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="一只鹈鹕骑着自行车飞驰">
  <title>骑车的鹈鹕</title>
  <desc>一只橙色大嘴的鹈鹕骑着蓝色自行车，车轮转动、翅膀扑扇，云朵和路面随风后退。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec3f0"/>
      <stop offset="0.55" stop-color="#b8e2fb"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed36a"/>
      <stop offset="1" stop-color="#6fb84e"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="620" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g transform="translate(105,105)">
    <circle r="78" fill="url(#sunGlow)"/>
    <g stroke="#ffcf4d" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <line y1="-52" y2="-70"/><line y1="52" y2="70"/>
      <line x1="-52" x2="-70"/><line x1="52" x2="70"/>
      <line x1="-38" y1="-38" x2="-50" y2="-50"/><line x1="38" y1="38" x2="50" y2="50"/>
      <line x1="-38" y1="38" x2="-50" y2="50"/><line x1="38" y1="-38" x2="50" y2="-50"/>
    </g>
    <circle r="46" fill="#ffd75e" stroke="#f7b733" stroke-width="5"/>
  </g>

  <!-- 远处的飞鸟（V 形振翅） -->
  <g transform="translate(600,118)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="600 118;592 114;600 118" dur="3s" repeatCount="indefinite"/>
    <g fill="none" stroke="#5b7d9e" stroke-width="3.5" stroke-linecap="round">
      <path d="M-12,0 Q-6,-7 0,0 Q6,-7 12,0">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.45;1 1" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <g transform="translate(668,92)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="668 92;674 88;668 92" dur="3.6s" repeatCount="indefinite"/>
    <path d="M-9,0 Q-4.5,-5.5 0,0 Q4.5,-5.5 9,0" fill="none" stroke="#5b7d9e" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 0.45;1 1" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 云（随风后退） -->
  <g fill="#ffffff" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="26s" repeatCount="indefinite"/>
    <g>
      <ellipse cx="250" cy="140" rx="48" ry="26"/><ellipse cx="292" cy="126" rx="34" ry="22"/><ellipse cx="212" cy="128" rx="30" ry="19"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="700" cy="200" rx="40" ry="20"/><ellipse cx="736" cy="188" rx="28" ry="17"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="950" cy="90" rx="36" ry="18"/><ellipse cx="984" cy="80" rx="24" ry="14"/>
    </g>
    <g>
      <ellipse cx="1250" cy="140" rx="48" ry="26"/><ellipse cx="1292" cy="126" rx="34" ry="22"/><ellipse cx="1212" cy="128" rx="30" ry="19"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="1700" cy="200" rx="40" ry="20"/><ellipse cx="1736" cy="188" rx="28" ry="17"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1950" cy="90" rx="36" ry="18"/><ellipse cx="1984" cy="80" rx="24" ry="14"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0,470 L0,420 Q120,360 260,405 Q380,445 520,395 Q650,350 780,410 Q840,435 900,415 L900,470 Z" fill="#a5d7a1"/>
  <!-- 近处丘陵 -->
  <path d="M0,470 L0,442 Q200,400 420,436 Q640,470 900,430 L900,470 Z" fill="#8cc98a"/>

  <!-- 草地 -->
  <rect y="470" width="900" height="62" fill="url(#grass)"/>

  <!-- 树（后退） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite"/>
    <g>
      <rect x="148" y="424" width="13" height="50" rx="4" fill="#8a5a3b"/>
      <circle cx="154" cy="404" r="36" fill="#4e9c4f"/><circle cx="130" cy="420" r="24" fill="#4e9c4f"/><circle cx="180" cy="418" r="26" fill="#57a857"/>
    </g>
    <g>
      <rect x="548" y="436" width="10" height="38" rx="4" fill="#8a5a3b"/>
      <circle cx="553" cy="420" r="27" fill="#5aa85c"/><circle cx="534" cy="432" r="18" fill="#57a857"/>
    </g>
    <g>
      <rect x="948" y="424" width="13" height="50" rx="4" fill="#8a5a3b"/>
      <circle cx="954" cy="404" r="36" fill="#4e9c4f"/><circle cx="930" cy="420" r="24" fill="#4e9c4f"/><circle cx="980" cy="418" r="26" fill="#57a857"/>
    </g>
    <g>
      <rect x="1348" y="436" width="10" height="38" rx="4" fill="#8a5a3b"/>
      <circle cx="1353" cy="420" r="27" fill="#5aa85c"/><circle cx="1334" cy="432" r="18" fill="#57a857"/>
    </g>
  </g>

  <!-- 草丛（后退） -->
  <g fill="none" stroke="#3f8f3f" stroke-width="3.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="4s" repeatCount="indefinite"/>
    <g>
      <path d="M92,532 q-3,-12 -8,-16 M92,532 q1,-14 7,-17 M92,532 q5,-9 11,-11"/>
      <path d="M420,532 q-3,-12 -8,-16 M420,532 q1,-14 7,-17 M420,532 q5,-9 11,-11"/>
      <path d="M760,532 q-3,-12 -8,-16 M760,532 q1,-14 7,-17 M760,532 q5,-9 11,-11"/>
    </g>
    <g>
      <path d="M1092,532 q-3,-12 -8,-16 M1092,532 q1,-14 7,-17 M1092,532 q5,-9 11,-11"/>
      <path d="M1420,532 q-3,-12 -8,-16 M1420,532 q1,-14 7,-17 M1420,532 q5,-9 11,-11"/>
      <path d="M1760,532 q-3,-12 -8,-16 M1760,532 q1,-14 7,-17 M1760,532 q5,-9 11,-11"/>
    </g>
  </g>

  <!-- 路面 -->
  <rect y="530" width="900" height="90" fill="#4b5563"/>
  <rect y="530" width="900" height="8" fill="#3a4250"/>
  <!-- 路面白虚线（后退） -->
  <g fill="#f4f6f8" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-180 0" dur="0.35s" repeatCount="indefinite"/>
    <rect x="0" y="572" width="64" height="9" rx="4.5"/><rect x="180" y="572" width="64" height="9" rx="4.5"/>
    <rect x="360" y="572" width="64" height="9" rx="4.5"/><rect x="540" y="572" width="64" height="9" rx="4.5"/>
    <rect x="720" y="572" width="64" height="9" rx="4.5"/><rect x="900" y="572" width="64" height="9" rx="4.5"/>
    <rect x="1080" y="572" width="64" height="9" rx="4.5"/><rect x="1260" y="572" width="64" height="9" rx="4.5"/>
  </g>

  <!-- 车与鹈鹕的整体阴影 -->
  <ellipse cx="468" cy="531" rx="185" ry="10" fill="#1f2937" opacity="0.18"/>

  <!-- ====== 自行车 + 鹈鹕（整体轻微颠簸） ====== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 链条与后飞轮 -->
    <path d="M441,448 L330,452 M441,470 L330,468" stroke="#4a4f57" stroke-width="4"/>
    <circle cx="330" cy="460" r="13" fill="#b9c0ca" stroke="#6b7280" stroke-width="3"/>

    <!-- 后轮（辐条旋转） -->
    <g>
      <circle cx="330" cy="460" r="66" fill="none" stroke="#2f3542" stroke-width="11"/>
      <circle cx="330" cy="460" r="55" fill="none" stroke="#9aa3b2" stroke-width="4"/>
      <g stroke="#c3cad6" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 330 460" to="360 330 460" dur="1.2s" repeatCount="indefinite"/>
        <line x1="330" y1="405" x2="330" y2="515"/><line x1="275" y1="460" x2="385" y2="460"/>
        <line x1="291" y1="421" x2="369" y2="499"/><line x1="291" y1="499" x2="369" y2="421"/>
      </g>
      <circle cx="330" cy="460" r="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
    </g>

    <!-- 前轮（辐条旋转） -->
    <g>
      <circle cx="590" cy="460" r="66" fill="none" stroke="#2f3542" stroke-width="11"/>
      <circle cx="590" cy="460" r="55" fill="none" stroke="#9aa3b2" stroke-width="4"/>
      <g stroke="#c3cad6" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 590 460" to="360 590 460" dur="1.2s" repeatCount="indefinite"/>
        <line x1="590" y1="405" x2="590" y2="515"/><line x1="535" y1="460" x2="645" y2="460"/>
        <line x1="551" y1="421" x2="629" y2="499"/><line x1="551" y1="499" x2="629" y2="421"/>
      </g>
      <circle cx="590" cy="460" r="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
    </g>

    <!-- 车座与座管 -->
    <rect x="410" y="342" width="10" height="90" rx="4" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
    <path d="M384,340 Q415,328 448,340 Q415,354 384,340 Z" fill="#3f4652" stroke="#2b303a" stroke-width="2"/>

    <!-- 车架 -->
    <g fill="none" stroke="#e8593c" stroke-linecap="round">
      <path d="M441,460 L415,352" stroke-width="11"/>
      <path d="M415,352 L556,352" stroke-width="9"/>
      <path d="M441,460 L556,352" stroke-width="11"/>
      <path d="M330,460 L441,460" stroke-width="8"/>
      <path d="M330,460 L415,352" stroke-width="7"/>
    </g>
    <!-- 头管与前叉 -->
    <path d="M552,336 L560,368" stroke="#e8593c" stroke-width="12" stroke-linecap="round"/>
    <path d="M558,352 C570,395 582,430 590,460" fill="none" stroke="#e8593c" stroke-width="9" stroke-linecap="round"/>

    <!-- 车把 -->
    <path d="M552,336 C548,318 556,306 574,304" fill="none" stroke="#3f4652" stroke-width="7" stroke-linecap="round"/>
    <circle cx="576" cy="304" r="6" fill="#2b303a"/>

    <!-- 踏板曲柄（旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 441 460" to="360 441 460" dur="1.2s" repeatCount="indefinite"/>
      <line x1="441" y1="460" x2="475" y2="460" stroke="#2b303a" stroke-width="7" stroke-linecap="round"/>
      <rect x="468" y="454" width="24" height="11" rx="3" fill="#2b303a"/>
      <line x1="441" y1="460" x2="407" y2="460" stroke="#2b303a" stroke-width="7" stroke-linecap="round"/>
      <rect x="398" y="454" width="24" height="11" rx="3" fill="#2b303a"/>
    </g>
    <circle cx="441" cy="460" r="11" fill="#f2b705" stroke="#2b303a" stroke-width="4"/>

    <!-- ====== 鹈鹕（身体随蹬踏起伏） ====== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3.5;0 0" dur="1.2s" repeatCount="indefinite"/>

      <!-- 尾巴 -->
      <path d="M306,292 L248,304 L298,322 Z M306,318 L258,338 L310,336 Z" fill="#e7dcc2"/>

      <!-- 远侧腿（蹬踏） -->
      <g>
        <path fill="none" stroke="#d99a2b" stroke-width="11" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
            values="M362,318 Q404,372 410,452; M362,318 Q398,398 441,424; M362,318 Q412,398 472,452; M362,318 Q404,372 410,452"/>
        </path>
        <rect width="20" height="9" rx="3" fill="#b57f1e">
          <animate attributeName="x" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="401;432;463;401"/>
          <animate attributeName="y" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="447;419;447;447"/>
        </rect>
      </g>

      <!-- 身体 -->
      <ellipse cx="368" cy="278" rx="80" ry="62" fill="#f6efdd" stroke="#e0d5b8" stroke-width="2.5"/>
      <ellipse cx="352" cy="298" rx="48" ry="34" fill="#eadfc4" opacity="0.7"/>

      <!-- 翅膀（扑扇） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 402 252; -16 402 252; -6 402 252" dur="0.9s" repeatCount="indefinite"/>
        <path d="M300,258 C330,224 398,222 416,254 C424,272 404,292 372,296 C336,300 306,286 300,258 Z" fill="#e9dfc6" stroke="#d8cbaa" stroke-width="2"/>
        <path d="M318,264 Q360,240 404,258 M322,278 Q362,256 400,272" fill="none" stroke="#d8cbaa" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 脖子 -->
      <path d="M414,240 C438,208 436,182 458,160" fill="none" stroke="#f6efdd" stroke-width="27" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="468" cy="146" r="29" fill="#f6efdd" stroke="#e0d5b8" stroke-width="2.5"/>
      <path d="M450,124 Q468,112 486,124" fill="none" stroke="#e0d5b8" stroke-width="3" stroke-linecap="round"/>

      <!-- 大嘴（上喙 + 喉囊） -->
      <path d="M492,132 C548,126 606,140 652,158 L650,170 C600,164 546,156 494,156 Z" fill="#f2a33c" stroke="#d9822b" stroke-width="2"/>
      <path d="M496,156 C556,158 604,166 648,168 C626,206 574,224 522,212 C502,206 492,182 496,156 Z" fill="#f6b352" stroke="#d9822b" stroke-width="2"/>
      <path d="M508,172 C540,186 580,194 616,190" fill="none" stroke="#e09a3f" stroke-width="3" stroke-linecap="round"/>
      <circle cx="650" cy="164" r="4.5" fill="#d9822b"/>

      <!-- 眼睛（会眨眼） -->
      <g>
        <circle cx="478" cy="138" r="8" fill="#ffffff" stroke="#d9cfae" stroke-width="1.5"/>
        <circle cx="480" cy="139" r="4.2" fill="#26221c"/>
        <circle cx="482" cy="137" r="1.6" fill="#ffffff"/>
        <ellipse cx="478" cy="138" rx="8.5" ry="9" fill="#f6efdd">
          <animate attributeName="ry" values="0;0;9;0;0" keyTimes="0;0.88;0.92;0.96;1" dur="4.2s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- 近侧腿（蹬踏） -->
      <g>
        <path fill="none" stroke="#f2a33c" stroke-width="12" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
            values="M370,322 Q416,380 472,452; M370,322 Q414,402 441,490; M370,322 Q402,380 410,452; M370,322 Q416,380 472,452"/>
        </path>
        <rect width="22" height="10" rx="3.5" fill="#d9822b">
          <animate attributeName="x" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="463;432;401;463"/>
          <animate attributeName="y" dur="1.2s" repeatCount="indefinite" calcMode="linear" values="447;485;447;447"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- 车轮卷起的尘烟 -->
  <g fill="#d8d2c4">
    <circle cx="300" cy="516" r="7">
      <animate attributeName="cx" values="300;252" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="516;498" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;14" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="522" r="6">
      <animate attributeName="cx" values="300;246" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="522;508" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;12" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-linecap="round">
    <line x1="235" y1="248" x2="175" y2="248" stroke-width="6">
      <animate attributeName="x1" values="235;120" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="175;60" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="255" y1="304" x2="205" y2="304" stroke-width="5">
      <animate attributeName="x1" values="255;140" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="205;90" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="205" x2="258" y2="205" stroke-width="4">
      <animate attributeName="x1" values="300;190" dur="0.55s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="258;150" dur="0.55s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="0.55s" begin="0.35s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>