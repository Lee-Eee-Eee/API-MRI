[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "0.4.0"
description = "Single-API fingerprint checks and reproducible service-consistency research"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.278",
  "model-equality-testing==0.0.2",
  "numpy>=1.26,<3",
  "torch==2.8.0",
  "tqdm>=4.66,<5",
  "transformers>=4.45,<5",
  "scipy>=1.11,<2",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
api = ["openai>=3.4,<4"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay_audit = ["static/*.html", "static/*.css", "static/*.js", "data/reference_packs/*.json", "data/reference_packs/NOTICE", "vendor/kbf/LICENSE", "vendor/kbf/NOTICE", "vendor/kbf/UPSTREAM.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

